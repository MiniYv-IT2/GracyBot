[plugin]
name        = "GracyUI管理面板"
version     = "1.9.2"
author      = "GracyBot开发团队"
description = "Web可视化Bot管理面板，提供仪表盘、好友管理、插件管理、日志中心等模块，支持跨平台适配层通用"

[handler]
entry       = "handle_gracy_ui"

[trigger]
commands       = ["/管理面板", "/webui", "/dashboard"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/管理面板" = "打开或获取Web管理面板访问地址"
"/webui"    = "打开Web管理面板（英文别名）"
"/dashboard" = "获取仪表盘信息概览"
