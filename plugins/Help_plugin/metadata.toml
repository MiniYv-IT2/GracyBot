[plugin]
name        = "帮助插件"
version     = "1.1.3"
author      = "GracyBot开发团队"
description = "查看所有命令，包括插件，返回一张帮助图片"

[handler]
entry       = "handle_help"

[trigger]
commands       = ["/help", "/帮助", "/菜单", "/helps"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false
