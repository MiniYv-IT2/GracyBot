[plugin]
name        = "原神崩铁查询插件"
version     = "1.0.0"
author      = "GracyBot开发团队"
description = "通过早柚核心(GsCore)实现原神/崩铁游戏数据查询，支持玩家信息、角色面板、深渊战绩、体力/开拓力等查询功能"

[handler]
entry       = "handle_genshin"

[trigger]
commands       = [
    "/原神绑定", "/原神uid", "/我的角色", "/深渊", "/体力",
    "/崩铁绑定", "/崩铁uid", "/忘却之庭", "/开拓力",
    "/扫码登陆", "/签到", "/绑定帮助", "/绑定信息", "/刷新ck",
    "/攻略", "/面板", "/查角色", "/查武器", "/查圣遗物",
    "/查天赋", "/角色材料", "/武器材料", "/查命座",
    "/查原魔", "/查食物", "/哪里有", "/原神任务",
    "/版本深渊", "/活动列表", "/卡池列表",
    "/原神公告", "/七圣召唤", "/版本规划",
    "/抽卡记录", "/每月统计", "/实时便笺", "/我的背包",
    "/伤害乘区", "/gs帮助",
]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/原神绑定"   = "绑定原神UID（例：/原神绑定 123456789）"
"/原神uid"    = "查看指定或已绑定的原神UID信息"
"/我的角色"   = "查看已绑定UID的角色面板/角色列表"
"/深渊"       = "查看原神深境螺旋战绩"
"/体力"       = "查看原神实时便笺（树脂/派遣/洞天宝钱）"
"/崩铁绑定"   = "绑定崩坏:星穹铁道UID（例：/崩铁绑定 123456789）"
"/崩铁uid"    = "查看指定或已绑定的崩铁UID信息"
"/忘却之庭"   = "查看崩铁忘却之庭/混沌回忆战绩"
"/开拓力"     = "查看崩铁开拓力/派遣信息"
"/扫码登陆"   = "米游社扫码登录（绑定CK，之后才能查询）"
"/签到"       = "米游社每日签到"
"/绑定帮助"   = "查看CK绑定详细帮助"
"/绑定信息"   = "查看当前已绑定的UID和CK状态"
"/刷新ck"     = "刷新已绑定的失效Cookie"
"/攻略"       = "查看角色攻略（例：/攻略 胡桃）"
"/面板"       = "查看角色参考面板（例：/面板 胡桃）"
"/查角色"     = "查询角色图鉴（例：/查角色 胡桃）"
"/查武器"     = "查询武器图鉴（例：/查武器 和璞鸢）"
"/查圣遗物"   = "查询圣遗物图鉴（例：/查圣遗物 绝缘）"
"/查天赋"     = "查询角色天赋（例：/查天赋 胡桃）"
"/角色材料"   = "查询角色培养材料（例：/角色材料 胡桃）"
"/武器材料"   = "查询武器突破材料（例：/武器材料 和璞鸢）"
"/查命座"     = "查询角色命座详情（例：/查命座 胡桃）"
"/查原魔"     = "查询怪物图鉴（例：/查原魔 急冻树）"
"/查食物"     = "查询食物图鉴（例：/查食物 仙跳墙）"
"/哪里有"     = "查询材料采集地图（例：/哪里有 蒲公英）"
"/原神任务"   = "查询任务攻略（例：/原神任务 第一章）"
"/版本深渊"   = "查看当期深渊阵容统计"
"/活动列表"   = "查看原神当前活动列表"
"/卡池列表"   = "查看当期卡池信息"
"/原神公告"   = "查看原神公告"
"/七圣召唤"   = "查询七圣召唤数据"
"/版本规划"   = "原石/资源规划预估"
"/抽卡记录"   = "查询抽卡历史记录"
"/每月统计"   = "查询每月资源统计"
"/实时便笺"   = "查看体力/派遣/洞天宝钱"
"/我的背包"   = "查询背包材料"
"/伤害乘区"   = "查看伤害乘区表"
"/gs帮助"     = "查看GenshinUID完整帮助"
