[plugin]
name        = "示例插件"
version     = "1.0.0"
author      = "GracyBot开发团队"
description = "展示版本控制和依赖管理功能的示例插件"

[handler]
entry       = "handle_example"

[trigger]
commands       = ["/示例", "/version", "/示例依赖"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/示例"     = "查看示例插件基本功能演示"
"/version"  = "查看所有已加载插件的版本与依赖信息"
"/示例依赖" = "了解插件依赖管理功能的使用说明"
