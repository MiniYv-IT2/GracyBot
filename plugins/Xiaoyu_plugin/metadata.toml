[plugin]
name        = "小禹插件"
version     = "2.0.0"
author      = "GracyBot开发团队"
description = "官方核心控制中枢，支持时间查询、主人/机器人QQ变更、黑名单管理、热重载开关、帮助图片、插件依赖安装等功能"

[handler]
entry       = "handle_xiaoyu"

[trigger]
commands       = ["/查看时间", "/几点了", "/时间", "/时间查询", "/time", "/复读", "/更改主人", "/更改机器人", "/互换主人", "/黑名单", "/热重载", "/安装依赖", "小禹帮助"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/查看时间"   = "显示当前系统日期与时间（别名：/几点了、/时间、/时间查询、/time）"
"/复读"       = "复读机：输入 /复读 内容 让机器人原样回复（所有人可用）"
"/更改主人"   = "修改机器人主人QQ号（仅主人可用）"
"/更改机器人" = "修改机器人自身QQ号（仅主人可用）"
"/互换主人"   = "一键互换主人QQ和机器人QQ，防止填反救急（仅主人可用）"
"/黑名单"     = "黑名单管理：打开/关闭/添加/删除/列表（仅主人可用）"
"/热重载"     = "热重载开关：/热重载 开启 或 /热重载 关闭，重启后生效（仅主人可用）"
"/安装依赖"   = "一键安装指定插件的 pip 依赖：/安装依赖 <插件目录名>（仅主人可用）"
"小禹帮助"    = "显示小禹插件全部功能帮助图（无斜杠指令，所有人可用）"
