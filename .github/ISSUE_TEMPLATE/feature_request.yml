name: 功能建议
description: 新功能或改进想法
labels: ["✨ feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      placeholder: 当 ... 时，操作很不方便
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
